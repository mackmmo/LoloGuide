  <body>

    <main class="app-shell app-shell--map-first">
      <aside class="sidebar-column">
        <section class="panel controls-panel">
          <div class="brand-lockup">
            <p class="app-title">A Rock Climber's Guide to Lolo Pass Web App</p>
          </div>

          <div id="filters-panel-body" class="filters-panel-body">
            <div class="filter-grid">
              <label class="full-span">
                <span>Search</span>
                <input id="search-input" type="text" placeholder="Route, grade, type, area, subarea..." />
              </label>
              <label>
                <span>Sector</span>
                <select id="sector-filter"></select>
              </label>
              <label>
                <span>Area</span>
                <select id="area-filter"></select>
              </label>
              <label>
                <span>Subarea</span>
                <select id="subarea-filter"></select>
              </label>
              <label>
                <span>Type</span>
                <select id="type-filter"></select>
              </label>
              <label>
                <span>Sort</span>
                <select id="sort-filter">
                  <option value="default">Default</option>
                  <option value="leftToRight">Left to Right</option>
                  <option value="rightToLeft">Right to Left</option>
                  <option value="name">Name A-Z</option>
                  <option value="grade">Grade</option>
                  <option value="stars">Stars</option>
                  <option value="height">Height</option>
                </select>
              </label>
            </div>

          </div>

          <button id="reset-all" class="ghost reset-button">Reset Filters</button>
        </section>

        <section class="panel results-panel">
          <div class="section-head results-head">
            <div>
              <p class="eyebrow">Results</p>
              <h2 id="results-title">Routes</h2>
            </div>
            <p id="results-meta" class="muted">0 results</p>
          </div>

          <div id="record-list" class="record-list"></div>
        </section>
      </aside>

      <section class="panel detail-panel">
        <div class="section-head detail-head">
          <div class="detail-head-copy">
            <h2 id="detail-title" class="visually-hidden">Choose a route</h2>
            <p id="detail-subtitle" class="detail-summary muted">Area and subarea details will appear here when filters are applied.</p>
          </div>
        </div>

        <div id="detail-nav" class="detail-nav"></div>
        <div id="detail-description" class="description-card empty-state">
          Use the filters or click a route to inspect details without leaving the page.
        </div>
        <div id="detail-related" class="detail-related"></div>
        <div id="detail-facts" class="facts-grid"></div>
      </section>

      <section class="map-column">
        <section class="panel map-panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Map</p>
              <h2>Lolo Map</h2>
              <p class="muted">Click the areas for an overview popup.</p>
            </div>
          </div>

          <div id="map"></div>
        </section>
      </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="./state.js?v=62"></script>
    <script src="./dom.js?v=62"></script>
    <script src="./utils/utils.js?v=62"></script>
    <script src="./api.js?v=62"></script>
    <script src="./events.js?v=62"></script>
    <script src="./map.js?v=62"></script>
    <script src="./render.js?v=62"></script>
    <script src="./app.js?v=62"></script>

</html>
